name: Discord Voice Bot 24/7

on:
  schedule:
    - cron: '0 */4 * * *' # 💡 4時間おきに自動で安全に再起動させて24時間を維持します
  workflow_dispatch: # 💡 GitHubの画面から手動でいつでも起動できるボタンを作ります

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          # 音声中継に必要なLinuxのシステムパーツをGitHub側が自動で一瞬で用意してくれます
          sudo apt-get update && sudo apt-get install -y libtool autoconf automake

      - name: Start Discord Bot
        env:
          DISCORD_TOKEN_MAIN: ${{ secrets.DISCORD_TOKEN_MAIN }}
          DISCORD_TOKEN_A: ${{ secrets.DISCORD_TOKEN_A }}
          DISCORD_TOKEN_B: ${{ secrets.DISCORD_TOKEN_B }}
        run: node index.js
